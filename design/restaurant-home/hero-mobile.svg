t x="251" y="156" width="26" height="22" rx="3" fill="#FDE68A"></rect><circle cx="253" cy="190" r="2.5" fill="#FDE68A"></circle></g><g class="storeCrate"><g transform="translate(-264 0)"><rect x="452" y="208" width="24" height="18" rx="3" fill="#D97706"></rect><rect x="452" y="215" width="24" height="3" fill="#92400E"></rect><circle cx="458" cy="206" r="4" fill="#EF4444"></circle><circle cx="466" cy="205" r="4" fill="#22C55E"></circle><circle cx="472" cy="207" r="3" fill="#F97316"></circle></g></g><g transform="translate(-264 0)"><g><rect x="484" y="212" width="5" height="14" rx="2" fill="#1E3A8A"></rect><rect x="491" y="212" width="5" height="14" rx="2" fill="#1E3A8A"></rect><rect x="479" y="184" width="22" height="31" rx="9" fill="#2563EB"></rect><rect x="483" y="191" width="14" height="22" rx="3" fill="#F97316"></rect><rect x="476" y="190" width="5" height="16" rx="2.5" fill="#F2C29B"></rect><rect x="499" y="190" width="5" height="16" rx="2.5" fill="#F2C29B"></rect><circle cx="490" cy="174" r="9" fill="#F2C29B"></circle><path d="M481 172 Q482 162 490 162 Q499 162 499 172 Q494 167 481 172 Z" fill="#78350F"></path></g></g><g transform="translate(-59 0)"><g><rect x="187" y="212" width="5" height="14" rx="2" fill="#44403C"></rect><rect x="194" y="212" width="5" height="14" rx="2" fill="#44403C"></rect><rect x="182" y="184" width="22" height="31" rx="9" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="1"></rect><circle cx="193" cy="194" r="1.5" fill="#A8A29E"></circle><circle cx="193" cy="202" r="1.5" fill="#A8A29E"></circle><rect x="179" y="190" width="5" height="16" rx="2.5" fill="#E0AC85"></rect><rect class="wave" x="202" y="176" width="5" height="16" rx="2.5" fill="#E0AC85"></rect><circle cx="193" cy="174" r="9" fill="#E0AC85"></circle><rect x="185" y="160" width="16" height="9" rx="2" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="1"></rect><circle cx="188" cy="158" r="5" fill="#FFFFFF"></circle><circle cx="196" cy="156" r="6" fill="#FFFFFF"></circle><circle cx="201"