<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 360 322" role="img" font-family="system-ui, sans-serif" width="360" height="322"><title>Animacija Još vrijedi</title><desc>Prodavač kaže da je bolje dati popust nego baciti hranu, dostavljač na biciklu s ruksakom Još vrijedi vozi gajbu od prodavnice do restorana, a kuhar kaže da će od toga napraviti današnji meni.</desc>
<style>
.rider {
  animation: drive 11s ease-in-out infinite;
}
.riderMobile {
  animation: drive-mobile 11s ease-in-out infinite;
}
.wheel {
  transform-box: fill-box;
  transform-origin: center;
  animation: roll 11s ease-in-out infinite;
}
.bob {
  animation: bob 11s ease-in-out infinite;
}
.storeBubble {
  transform-box: fill-box;
  opacity: 0;
  animation: store-bubble 11s ease-out infinite;
}
.chefBubble {
  transform-box: fill-box;
  opacity: 0;
  animation: chef-bubble 11s ease-out infinite;
}
.storeCrate {
  animation: store-crate 11s ease-in-out infinite;
}
.restaurantCrate {
  opacity: 0;
  animation: restaurant-crate 11s ease-in-out infinite;
}
.clouds {
  animation: clouds 40s linear infinite;
}
.cloudsMobile {
  animation: clouds-mobile 24s linear infinite;
}
.wave {
  transform-box: fill-box;
  transform-origin: 0% 100%;
  animation: wave 11s ease-in-out infinite;
}
@keyframes drive {
  0%, 28% { transform: translateX(0); opacity: 1; }
  60%, 92% { transform: translateX(-200px); opacity: 1; }
  96% { transform: translateX(-200px); opacity: 0; }
  97% { transform: translateX(0); opacity: 0; }
  100% { transform: translateX(0); opacity: 1; }
}
@keyframes drive-mobile {
  0%, 28% { transform: translateX(0); opacity: 1; }
  60%, 92% { transform: translateX(-150px); opacity: 1; }
  96% { transform: translateX(-150px); opacity: 0; }
  97% { transform: translateX(0); opacity: 0; }
  100% { transform: translateX(0); opacity: 1; }
}
@keyframes roll {
  0%, 28% { transform: rotate(0); }
  60%, 100% { transform: rotate(-1440deg); }
}
@keyframes bob {
  0%, 28%, 60%, 100% { transform: translateY(0); }
  32%, 40%, 48%, 56% { transform: translateY(-1.5px); }
  36%, 44%, 52% { transform: translateY(0); }
}
@keyframes store-bubble {
  0%, 2% { opacity: 0; transform: scale(0.6); }
  6%, 24% { opacity: 1; transform: scale(1); }
  28%, 100% { opacity: 0; transform: scale(1); }
}
@keyframes chef-bubble {
  0%, 62% { opacity: 0; transform: scale(0.6); }
  66%, 90% { opacity: 1; transform: scale(1); }
  94%, 100% { opacity: 0; transform: scale(1); }
}
@keyframes store-crate {
  0%, 22% { opacity: 1; }
  26%, 97% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes restaurant-crate {
  0%, 62% { opacity: 0; transform: translateY(-8px); }
  66%, 92% { opacity: 1; transform: translateY(0); }
  96%, 100% { opacity: 0; }
}
@keyframes clouds {
  from { transform: translateX(0); }
  to { transform: translateX(-700px); }
}
@keyframes clouds-mobile {
  from { transform: translateX(0); }
  to { transform: translateX(-420px); }
}
@keyframes wave {
  0%, 64%, 72%, 80%, 100% { transform: rotate(0); }
  68%, 76% { transform: rotate(-25deg); }
}
@media (prefers-reduced-motion: reduce) {
  .rider,
  .riderMobile,
  .wheel,
  .bob,
  .clouds,
  .cloudsMobile,
  .wave,
  .storeCrate,
  .restaurantCrate {
    animation: none;
  }
  .storeBubble,
  .chefBubble {
    animation: none;
    opacity: 1;
  }
}
</style>
