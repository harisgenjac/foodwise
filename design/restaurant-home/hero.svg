<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img" font-family="system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Animacija Još vrijedi</title>
<desc>Prodavač kaže da je bolje dati popust nego baciti hranu, dostavljač na biciklu s ruksakom Još vrijedi vozi gajbu od prodavnice do restorana, a kuhar kaže da će od toga napraviti današnji meni.</desc>
<style>
.rider{animation:drive 11s ease-in-out infinite}
.wheel{transform-box:fill-box;transform-origin:center;animation:roll 11s ease-in-out infinite}
.crank{transform-box:fill-box;transform-origin:center;animation:roll 11s ease-in-out infinite}
.bob{animation:bob 11s ease-in-out infinite}
.sb{transform-box:fill-box;transform-origin:85% 100%;animation:sb 11s ease-out infinite;opacity:0}
.rb{transform-box:fill-box;transform-origin:10% 100%;animation:rb 11s ease-out infinite;opacity:0}
.scrate{animation:sc 11s ease-in-out infinite}
.rcrate{animation:rc 11s ease-in-out infinite;opacity:0}
.cloud{animation:cloud 40s linear infinite}
.wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave 11s ease-in-out infinite}
@keyframes drive{0%,28%{transform:translateX(0);opacity:1}60%,92%{transform:translateX(-200px);opacity:1}96%{transform:translateX(-200px);opacity:0}97%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes roll{0%,28%{transform:rotate(0)}60%,100%{transform:rotate(-1440deg)}}
@keyframes bob{0%,28%,60%,100%{transform:translateY(0)}32%,40%,48%,56%{transform:translateY(-1.5px)}36%,44%,52%{transform:translateY(0)}}
@keyframes sb{0%,2%{opacity:0;transform:scale(.6)}6%,24%{opacity:1;transform:scale(1)}28%,100%{opacity:0;transform:scale(1)}}
@keyframes rb{0%,62%{opacity:0;transform:scale(.6)}66%,90%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(1)}}
@keyframes sc{0%,22%{opacity:1}26%,97%{opacity:0}100%{opacity:1}}
@keyframes rc{0%,62%{opacity:0;transform:translateY(-8px)}66%,92%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}
@keyframes cloud{from{transform:translateX(0)}to{transform:translateX(-700px)}}
@keyframes wave{0%,64%,72%,80%,100%{transform:rotate(0)}68%,76%{transform:rotate(-25deg)}}
@media (prefers-reduced-motion:reduce){.rider,.wheel,.crank,.bob,.cloud,.wave,.scrate{animation:none}.sb,.rb{animation:none;opacity:1}.rcrate{animation:none}}
.label{font-size:14px;font-weight:500}
.small{font-size:12px;font-weight:400}
</style>
