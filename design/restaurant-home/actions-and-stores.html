<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Još vrijedi – dugmad i prodavnice (predložak)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
body{margin:0;padding:24px;font-family:system-ui,sans-serif;background:#F9FAFB}
.wrap{max-width:1024px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 28px}
.b{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
.b i{font-size:20px}
.b1{background:#F97316;color:#FFFFFF;border:none}
.b2{background:#FFFFFF;color:#0F766E;border:1.5px solid #0F766E}
.cnt{background:#0F766E;color:#FFFFFF;font-size:12px;border-radius:10px;padding:1px 8px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.head h3{margin:0;font-size:18px;color:#1C1917}
.arr{display:flex;gap:8px}
.arr button{width:36px;height:36px;border-radius:50%;border:1px solid #D6D3D1;background:#FFFFFF;cursor:pointer;display:flex;align-items:center;justify-content:center}
.track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 140px;scroll-snap-align:start;background:#FFFFFF;border:1px solid #E7E5E4;border-radius:12px;padding:16px 10px;text-align:center;cursor:pointer;text-decoration:none}
.logo{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600}
.nm{font-size:14px;color:#1C1917;line-height:1.3;height:36px;overflow:hidden}
.ct{font-size:12px;color:#78716C;margin-top:4px}
.all{background:#F0FDFA;border:1px dashed #5EEAD4;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#0F766E;font-size:14px;gap:6px}
@media (max-width:639px){.btns{grid-template-columns:1fr}.arr{display:none}.card{flex-basis:120px}}
</style>
</head>
<body>
<div class="wrap">
<div class="btns">
<a class="b b1" href="#"><i class="ti ti-search" aria-hidden="true"></i>Pretraži proizvode</a>
<a class="b b2" href="#"><i class="ti ti-receipt" aria-hidden="true"></i>Moje narudžbe<span class="cnt">2</span></a>
</div>
<div class="head"><h3>Prodavnice u blizini</h3><div class="arr"><button aria-label="Nazad" onclick="document.getElementById('tr').scrollBy({left:-304,behavior:'smooth'})"><i class="ti ti-chevron-left" aria-hidden="true"></i></button><button aria-label="Naprijed" onclick="document.getElementById('tr').scrollBy({left:304,behavior:'smooth'})"><i class="ti ti-chevron-right" aria-hidden="true"></i></button></div></div>
<div class="track" id="tr">
<a class="card" href="#"><div class="logo" style="background:#FEE2E2;color:#B91C1C">B</div><div class="nm">Bingo Sarajevo Centar</div><div class="ct">0 km</div></a>
<a class="card" href="#"><div class="logo" style="background:#DCFCE7;color:#15803D">ZM</div><div class="nm">Zelena Market</div><div class="ct">0 km</div></a>
<a class="card" href="#"><div class="logo" style="background:#FFEDD5;color:#C2410C">PK</div><div class="nm">Pekara Kod Mirze</div><div class="ct">2 km</div></a>
<a class="card" href="#"><div class="logo" style="background:#E0F2FE;color:#0369A1">MS</div><div class="nm">Mesnica Sarajka</div><div class="ct">5 km</div></a>
<a class="card" href="#"><div class="logo" style="background:#FEF3C7;color:#B45309">B</div><div class="nm">Bingo Visoko</div><div class="ct">24 km</div></a>
<a class="card" href="#"><div class="logo" style="background:#F3E8FF;color:#7E22CE">VM</div><div class="nm">Voćni Most</div><div class="ct">31 km</div></a>
<a class="card all" href="#"><i class="ti ti-building-store" style="font-size:24px" aria-hidden="true"></i>Sve prodavnice</a>
</div>
</div>
</body>
</html>
