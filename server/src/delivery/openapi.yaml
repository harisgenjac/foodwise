openapi: 3.1.0
info:
  title: Još vrijedi delivery provider API
  version: 0.1.0
  summary: The contract a delivery provider (Korpa, later our own delivery app) implements for Još vrijedi.
  description: |
    Written by Još vrijedi (Nov 16, 2026) as the proposal for the agreement with Korpa; not agreed yet.
    Još vrijedi is the client of these endpoints, and the provider calls Još vrijedi back with webhooks.
    The server's `MockProvider` (`server/src/delivery/mock.ts`) follows this contract.

    How an order uses it:
    1. Cart: Još vrijedi asks for a **quote** (price and times) for the store → restaurant route.
    2. The store accepts the order with a ready time: Još vrijedi **creates the delivery** with the
       ready time and the cash the courier collects (goods + delivery), using the order as the
       idempotency key.
    3. The provider sends **webhooks** as the courier is assigned, picks the goods up, delivers or
       fails. "Picked up" completes the order on Još vrijedi.
    4. Before the pickup Još vrijedi may **cancel** the delivery.

    Conventions:
    - Money is a string with exactly two decimals in convertible marks (`"12.50"`, currency `BAM`).
    - Times are ISO 8601 date-times with an offset (`2026-11-16T10:30:00+01:00` or `...Z`).
    - Errors are `{ code, message }`; `code` is machine-readable and stable, `message` is English
      for logs and is never shown to users.
servers:
  - url: https://api.provider.example/josvrijedi/v1
    description: Placeholder; the provider gives the sandbox and production URLs.
security:
  - apiKey: []

paths:
  /quotes:
    post:
      operationId: createQuote
      summary: Price and times for a delivery, without booking it.
      description: |
        Valid until `expires_at`. Answers 422 when the provider cannot deliver this route
        (outside its zones, or no couriers at that time); Još vrijedi then offers only pickup.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Delivery is not available for this route.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      code: { enum: [OUT_OF_ZONE, UNAVAILABLE] }

  /deliveries:
    post:
      operationId: createDelivery
      summary: Book a courier for an accepted order.
      description: |
        With `quote_id` the quoted price is kept while the quote is valid; without it the provider
        prices the route now. `cash_to_collect` must equal `goods_amount` + the delivery price.
        The same `Idempotency-Key` always answers with the delivery it created first (201 again),
        so Još vrijedi can retry safely after a timeout.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeliveryRequest" }
      responses:
        "201":
          description: The delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`QUOTE_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`QUOTE_EXPIRED`: ask for a new quote."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`OUT_OF_ZONE` or `UNAVAILABLE`, as for quotes."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /deliveries/{deliveryId}:
    get:
      operationId: getDelivery
      summary: The current state of a delivery (for reconciling missed webhooks).
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: The delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DeliveryNotFound" }

  /deliveries/{deliveryId}/cancel:
    post:
      operationId: cancelDelivery
      summary: Cancel a delivery before the courier picked the goods up.
      description: No webhook is sent for a cancel Još vrijedi asked for.
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 300 }
      responses:
        "200":
          description: The cancelled delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DeliveryNotFound" }
        "409":
          description: "`ALREADY_PICKED_UP`, or `DELIVERY_CLOSED` for a failed or cancelled delivery."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

webhooks:
  deliveryEvent:
    post:
      operationId: deliveryEvent
      summary: A delivery changed status (sent by the provider to Još vrijedi).
      description: |
        Sent to `POST {Još vrijedi API URL}/api/delivery/webhooks/{provider}` for every status change made on
        the provider's side. Signed (see the `X-JosVrijedi-Signature` header). The provider retries
        until Još vrijedi answers 2xx (suggested: 1 min, 5 min, 30 min, then hourly for 24 hours).
        Events may arrive more than once and out of order: Još vrijedi ignores an `event_id` it has
        already processed and a status change that would move a delivery backwards.

        Statuses: `CREATED → COURIER_ASSIGNED → PICKED_UP → DELIVERED`; `FAILED` from any open
        status; `CANCELLED` (by the provider) before `PICKED_UP`.
      parameters:
        - name: X-JosVrijedi-Timestamp
          in: header
          required: true
          description: Unix time in seconds when the call was signed; refused when more than 5 minutes from Još vrijedi's clock.
          schema: { type: string, pattern: "^[0-9]+$" }
        - name: X-JosVrijedi-Signature
          in: header
          required: true
          description: |
            `sha256=` + the hex HMAC-SHA256 of `"<timestamp>.<raw request body>"` with the shared
            webhook secret. Još vrijedi compares it in constant time over the raw bytes it received.
          schema: { type: string, pattern: "^sha256=[0-9a-fA-F]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryEvent" }
      responses:
        "200": { description: "Processed, or already processed before." }
        "400": { description: "The body is not a valid event." }
        "401": { description: "Missing or wrong signature, or a timestamp outside the window." }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: An API key the provider issues to Još vrijedi, one per environment.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Još vrijedi sends one key per order (e.g. `order-1234`).
      schema: { type: string, minLength: 1, maxLength: 100 }
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string }

  responses:
    InvalidRequest:
      description: "`INVALID_REQUEST`: a missing or malformed field."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or wrong API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DeliveryNotFound:
      description: "`DELIVERY_NOT_FOUND`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Money:
      type: string
      pattern: "^[0-9]{1,7}\\.[0-9]{2}$"
      examples: ["12.50"]
    DateTime:
      type: string
      format: date-time
      examples: ["2026-11-16T10:30:00+01:00"]

    Location:
      type: object
      required: [name, address, city, latitude, longitude, phone]
      properties:
        name: { type: string, description: The store's or restaurant's business name. }
        address: { type: string }
        city: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        phone: { type: string, description: For the courier to call. }

    QuoteRequest:
      type: object
      required: [pickup, dropoff, ready_at, goods_amount]
      properties:
        pickup: { $ref: "#/components/schemas/Location" }
        dropoff: { $ref: "#/components/schemas/Location" }
        ready_at:
          $ref: "#/components/schemas/DateTime"
          description: When the store will have the goods ready.
        goods_amount:
          $ref: "#/components/schemas/Money"
          description: The value of the goods, collected by the courier in cash.

    Quote:
      type: object
      required: [quote_id, price, currency, estimated_pickup_at, estimated_delivery_at, expires_at]
      properties:
        quote_id: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        currency: { const: BAM }
        estimated_pickup_at: { $ref: "#/components/schemas/DateTime" }
        estimated_delivery_at: { $ref: "#/components/schemas/DateTime" }
        expires_at: { $ref: "#/components/schemas/DateTime" }

    CreateDeliveryRequest:
      type: object
      required: [external_order_id, external_order_code, pickup, dropoff, ready_at, goods_amount, cash_to_collect]
      properties:
        quote_id: { type: string }
        external_order_id: { type: integer, description: Još vrijedi's order id. }
        external_order_code: { type: string, description: "The short code the store and courier see, e.g. `K7PM`." }
        pickup: { $ref: "#/components/schemas/Location" }
        dropoff: { $ref: "#/components/schemas/Location" }
        ready_at: { $ref: "#/components/schemas/DateTime" }
        goods_amount: { $ref: "#/components/schemas/Money" }
        cash_to_collect:
          $ref: "#/components/schemas/Money"
          description: Goods plus the delivery price.
        notes: { type: string, maxLength: 500 }

    DeliveryStatus:
      type: string
      enum: [CREATED, COURIER_ASSIGNED, PICKED_UP, DELIVERED, FAILED, CANCELLED]

    Courier:
      type: object
      required: [name, phone]
      properties:
        name: { type: string }
        phone: { type: string }

    Delivery:
      type: object
      required:
        - delivery_id
        - external_order_id
        - status
        - price
        - currency
        - ready_at
        - estimated_pickup_at
        - estimated_delivery_at
        - courier
        - failure_reason
        - tracking_url
      properties:
        delivery_id: { type: string }
        external_order_id: { type: integer }
        status: { $ref: "#/components/schemas/DeliveryStatus" }
        price: { $ref: "#/components/schemas/Money" }
        currency: { const: BAM }
        ready_at: { $ref: "#/components/schemas/DateTime" }
        estimated_pickup_at: { $ref: "#/components/schemas/DateTime" }
        estimated_delivery_at: { $ref: "#/components/schemas/DateTime" }
        courier:
          oneOf:
            - $ref: "#/components/schemas/Courier"
            - type: "null"
        failure_reason: { type: [string, "null"] }
        tracking_url: { type: [string, "null"], format: uri }

    DeliveryEvent:
      type: object
      required: [event_id, type, delivery_id, external_order_id, occurred_at]
      properties:
        event_id: { type: string, description: Unique per event; the idempotency key of the webhook. }
        type:
          type: string
          enum:
            - delivery.courier_assigned
            - delivery.picked_up
            - delivery.delivered
            - delivery.failed
            - delivery.cancelled
        delivery_id: { type: string }
        external_order_id: { type: integer }
        occurred_at: { $ref: "#/components/schemas/DateTime" }
        courier:
          oneOf:
            - $ref: "#/components/schemas/Courier"
            - type: "null"
        failure_reason:
          type: [string, "null"]
          description: Required for `delivery.failed`.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - OUT_OF_ZONE
            - UNAVAILABLE
            - QUOTE_NOT_FOUND
            - QUOTE_EXPIRED
            - DELIVERY_NOT_FOUND
            - ALREADY_PICKED_UP
            - DELIVERY_CLOSED
        message: { type: string }
