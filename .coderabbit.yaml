# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  profile: chill            # fewer, more important comments; "assertive" = stricter
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"
    ignore_title_keywords:
      - "wip"

  path_filters:
    - "!**/package-lock.json"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/playwright-report/**"

  path_instructions:
    - path: "server/src/**"
      instructions: |
        Check against the business rules in docs/product.md and credits-spec.md:
        reservation statuses, credit charges and refunds (each charge refunded at
        most once), visibility of blocked and deactivated stores (use the shared
        visibility condition), company/branch rules.
        Every route must check role AND ownership (store, restaurant, company HQ,
        admin); data from another user or company must never leak; admin_note is
        never returned to users.
        SQL must be parameterized. Several related writes belong in one
        transaction. Business dates use APP_TIMEZONE, not the server time zone.
        Error messages are English.
    - path: "server/**/migrations/**"
      instructions: |
        Migrations must be safe for existing data, have a working down step, and
        add indexes for new foreign keys. Flag anything destructive.
    - path: "client/src/**"
      instructions: |
        Every UI text goes through i18n with keys in BOTH bs and en; flag
        hard-coded user-facing text. No dangerouslySetInnerHTML; no user input in
        href/src. Inputs need labels and buttons accessible names. Reuse the
        existing components (StatCard, FilterBar, CitySelect, ...). Filters live in
        component state, not in the URL. Pages for a role must be guarded for that
        role.
    - path: "**/*.test.{ts,tsx}"
      instructions: |
        Tests should check behaviour, not implementation details. Flag fixed
        sleeps/timeouts and tests that depend on each other.
    - path: "e2e/**"
      instructions: |
        Use role/label locators, unique test data per test, no waitForTimeout,
        no dependence on test order.
